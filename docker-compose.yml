# PostgreSQL 16 para desarrollo local. La aplicación NO depende de Docker en
# producción: en despliegue se usa una base de datos gestionada de capa gratuita
# (Neon / Supabase). Ver README.md.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecorecicla-postgres
    environment:
      POSTGRES_USER: ecorecicla
      POSTGRES_PASSWORD: ecorecicla
      POSTGRES_DB: ecorecicla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecorecicla"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
